# config
spring.application.name=262CC3S2BSpringSigvidBackend
server.port=8080

# lectura del .env
spring.config.import=optional:file:.env[.properties]

# conexion a la BD - lee las variables activas del .env
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# config JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update - asegura que las entidades creen o actualicen las tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# JWT
jwt.secret=${TOKEN_JWT_SECRET}
logging.level.org.springframework.security=DEBUG

# swagger
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED}